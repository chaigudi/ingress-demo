apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: ingress-test
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
      - name: web
        image: hashicorp/http-echo:0.2.3
        args:
          - "-text=Hello from WEB service"
        ports:
          - containerPort: 5678
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: ingress-test
spec:
  selector:
    app: web
  ports:
    - port: 80
      targetPort: 5678
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: ingress-test
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
      - name: api
        image: hashicorp/http-echo:0.2.3
        args:
          - "-text=Hello from API service"
        ports:
          - containerPort: 5678
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: ingress-test
spec:
  selector:
    app: api
  ports:
    - port: 80
      targetPort: 5678
  type: ClusterIP
